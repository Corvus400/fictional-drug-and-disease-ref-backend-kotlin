ktor:
  application:
    modules:
      - io.github.corvus400.fictionaldrugdiseaserefbackendkotlin.ApplicationKt.module
  deployment:
    port: ${PORT:8080}
    host: ${HOST:0.0.0.0}
  development: true

app:
  environment: local

database:
  url: ${DB_URL:jdbc:postgresql://localhost:5432/drugref}
  user: ${DB_USER:drugref}
  password: ${DB_PASSWORD:drugref}
  maxPoolSize: ${DB_MAX_POOL_SIZE:10}

security:
  jwtIssuer: ${JWT_ISSUER:http://localhost:8080}
  jwtAudience: ${JWT_AUDIENCE:fictional-drug-ref}
  jwtRealm: fictional-drug-ref
  rateLimitLimit: ${RATE_LIMIT_LIMIT:60}
  rateLimitRefillSeconds: ${RATE_LIMIT_REFILL_SECONDS:60}
  corsAllowedOrigins: ${CORS_ALLOWED_ORIGINS:}
