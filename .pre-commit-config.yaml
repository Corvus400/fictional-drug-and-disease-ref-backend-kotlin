# pre-commit = spotless (ratchet で変更ファイルのみ高速 check)
# gitleaks は global git pre-commit hook で commit 前に実行する。
# 重い test / detekt / contract / image gate は GitHub Actions CI に移管する。
repos:
  - repo: local
    hooks:
      - id: gradle-spotless-check
        name: Spotless check (ratchet from origin/main)
        entry: scripts/pre-commit-spotless-check.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
